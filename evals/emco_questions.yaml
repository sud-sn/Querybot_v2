# ── Metric registry ──────────────────────────────────────────────────────────
- id: metric-bare
  intent: metric by name
  english: net sales
  french: ventes nettes
  expect: {window: none, compile: no, template: yes}
  note: the one shape a fixed template may answer.

- id: metric-revenue-word
  intent: metric by synonym
  english: revenue
