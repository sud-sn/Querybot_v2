  english: and by warehouse?
  french: et par entrepôt ?
  expect: {followup: yes}

- id: followup-last-month
  intent: follow-up, elliptical with a period
  english: what about last month?
  french: et le mois dernier ?
  expect: {followup: yes}

- id: followup-top-3
  intent: follow-up, ranking
  english: show me the top 3
  french: montre-moi les 3 premiers
  expect: {followup: yes}

- id: followup-only-value
  intent: follow-up naming a cached value
  english: only Montreal
  french: seulement Montréal
  expect: {followup: yes}

- id: followup-drill-value
  intent: follow-up naming a cached value
  english: drill into Montreal
  french: détaille Montréal
  expect: {followup: yes}

- id: followup-sort
  intent: follow-up, result command
  english: sort these by net sales
  french: trie ces résultats par ventes nettes
