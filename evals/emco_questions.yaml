# EMCO rehearsal corpus — the ways a plumbing/HVAC/waterworks distributor asks.
#
# Shape this is written against (Infor M3 -> Azure SQL data mart):
#
#   EMDW_DMART.CUS_ORD_IVC_FCT   invoiced sales.  NET_SLS_AMT, GRS_SLS_AMT,
#                                ORD_QTY, and FOUR role-playing date keys:
#                                CUS_IVC_DT_DMS_KEY, SHP_DT_DMS_KEY,
#                                CNL_ORD_DT_DMS_KEY, IVC_PRD_DMS_KEY
#   EMDW_DMART.CUS_RTN_FCT       credits/returns.  RTN_AMT, RTN_QTY,
#                                RTN_DT_DMS_KEY
#   EMDW_DMART.INV_BAL_FCT       stock balance, SEMI-ADDITIVE.  BAL_QTY,
#                                BAL_VAL_AMT, BAL_DT_DMS_KEY
#   EMDW_DMART.DT_DMS            the shared date dimension every key joins to
#
# Each case is one question in both languages, plus what the pipeline is
# expected to do with it. `expect` is deliberately about the DECISION, not the
# text: which window, whether a metric template may answer it, whether the
# governed compiler may build it, whether it is a follow-up about the result on
# screen. Those are the things that were wrong, and they are what a rehearsal
# needs to see.
#
# expect keys:
#   window        the temporal window kind, or `none`
#   compile       yes | no        may the scalar governed compiler build it
#   template      yes | no        may a fixed metric template answer it
#   followup      yes | no | -    does it route to the result already on screen
#   note          why, when the expectation is not obvious

cases:

# ── Scalar totals over a rolling window ──────────────────────────────────────
- id: scalar-last-6-months
  intent: scalar total, rolling window
  english: what is the total net sales for the last 6 months?
  french: quel est le total des ventes nettes des 6 derniers mois ?
  expect: {window: last_n, compile: yes, template: no}

- id: scalar-last-30-days
  intent: scalar total, rolling days
  english: total net sales for the last 30 days
  french: total des ventes nettes des 30 derniers jours
  expect: {window: last_n, compile: yes, template: no}

- id: scalar-spelled-count
  intent: scalar total, count spelled as a word
  english: total net sales for the last six months
  french: total des ventes nettes des six derniers mois
  expect: {window: last_n, compile: yes, template: no}
  note: French spells the count more often than not; English still cannot.

- id: scalar-4-weeks
  intent: scalar total, feminine plural unit
  english: net sales for the last 4 weeks
  french: ventes nettes des 4 dernières semaines
  expect: {window: last_n, compile: yes, template: no}
  note: semaine is feminine — the inflection that used to lose the window.

- id: scalar-2-years
  intent: scalar total, feminine plural unit
  english: net sales for the last 2 years
  french: ventes nettes des 2 dernières années
  expect: {window: last_n, compile: yes, template: no}

# ── The current period, and to-date ──────────────────────────────────────────
- id: current-month
  intent: current period
  english: what is the total net sales for the current month?
  french: quel est le total des ventes nettes du mois en cours ?
  expect: {window: this_month, compile: yes, template: no}

- id: current-month-courant
  intent: current period, second spelling
  english: net sales this month
  french: ventes nettes du mois courant
  expect: {window: this_month, compile: yes, template: no}

- id: current-quarter
  intent: current period
  english: net sales this quarter
  french: ventes nettes du trimestre en cours
  expect: {window: this_quarter, compile: yes, template: no}

- id: year-to-date
  intent: to-date
  english: net sales year to date
  french: ventes nettes depuis le début de l'année
  expect: {window: this_year, compile: yes, template: no}

- id: year-to-date-cumul
  intent: to-date, accounting wording
  english: net sales year to date
  french: ventes nettes cumul annuel
  expect: {window: this_year, compile: yes, template: no}

- id: month-to-date
  intent: to-date
  english: net sales month to date
  french: ventes nettes cumul mensuel
  expect: {window: this_month, compile: yes, template: no}

- id: last-month
  intent: previous period
  english: net sales last month
  french: ventes nettes le mois dernier
  expect: {window: previous_month, compile: yes, template: no}

- id: last-year
  intent: previous period
  english: net sales last year
  french: ventes nettes de l'année dernière
  expect: {window: previous_year, compile: yes, template: no}

- id: last-year-curly
  intent: previous period, typographic apostrophe
  english: net sales last year
  french: ventes nettes de l’année dernière
  expect: {window: previous_year, compile: yes, template: no}
  note: U+2019 is what a French keyboard actually produces.

- id: yesterday
  intent: single day
  english: net sales yesterday
  french: ventes nettes hier
  expect: {window: yesterday, compile: yes, template: no}

# ── Trends ───────────────────────────────────────────────────────────────────
- id: trend-by-month
  intent: trend
  english: net sales trend by month for the last 6 months
  french: tendance des ventes nettes par mois sur les 6 derniers mois
  expect: {window: last_n, compile: no, template: no}
  note: a grouped/trend request leaves the scalar compiler by design.

- id: trend-by-year
  intent: trend over an integer year column
  english: net sales by year
  french: ventes nettes par année
  expect: {window: none, compile: no, template: no}
  note: the shape where IVC_YR used to be read as the measure.

# ── Rankings ─────────────────────────────────────────────────────────────────
- id: top-5-customers
  intent: ranking
  english: top 5 customers by net sales
  french: les 5 meilleurs clients par ventes nettes
  expect: {window: none, compile: no, template: no}

- id: top-5-spelled
  intent: ranking, count spelled as a word
  english: the five best customers by net sales
  french: les cinq meilleurs clients par ventes nettes
  expect: {window: none, compile: no, template: no}

- id: top-branches
  intent: ranking, French word order
  english: the top 3 branches by net sales
  french: les 3 premières succursales par ventes nettes
  expect: {window: none, compile: no, template: no}

- id: worst-products
  intent: ranking, ascending
  english: the 3 worst products by margin
