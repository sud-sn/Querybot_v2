  english: how many customers do we have?
  french: combien de clients avons-nous ?
  expect: {followup: no}
  note: must not be answered from the snapshot.

- id: fresh-not-followup-2
  intent: a NEW question while a result is on screen
  english: net sales by warehouse for 2024
  french: ventes nettes par entrepôt pour 2024
  expect: {followup: no}
