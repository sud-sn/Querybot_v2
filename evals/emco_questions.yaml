  note: must NOT compile to a single-window scalar.

- id: versus-last-year
  intent: comparison, second wording
  english: net sales versus last year
  french: ventes nettes par rapport à l'an dernier
  expect: {window: previous_year, compile: no, template: no}

- id: difference
  intent: comparison, difference
  english: what is the difference in net sales
  french: quelle est la différence de ventes nettes
  expect: {window: none, compile: no, template: no}

- id: why-changed
  intent: causal
  english: why did net sales change
  french: pourquoi les ventes nettes ont-elles changé
  expect: {window: none, compile: no, template: no}

# ── Distribution and share ───────────────────────────────────────────────────
- id: share-by-warehouse
