  expect: {window: last_n, compile: no, template: no}

- id: returns-by-warehouse
  intent: grouped breakdown on the returns fact
  english: returns by warehouse
  french: retours par entrepôt
  expect: {window: none, compile: no, template: no}

# ── Comparisons ──────────────────────────────────────────────────────────────
- id: compare-quarter-vs-last-year
  intent: comparison
  english: compare net sales this quarter with last year
  french: comparer les ventes nettes de ce trimestre avec l'an dernier
