  expect: {window: previous_month, compile: no, template: no}

# ── Inventory, semi-additive ─────────────────────────────────────────────────
- id: inventory-balance
  intent: semi-additive balance
  english: inventory balance by warehouse
  french: solde d'inventaire par entrepôt
