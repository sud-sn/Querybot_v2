        date: journal_lines.posting_date_key
        window: {kind: between, start: "2024-07-01", end: "2025-06-30"}
    reference_sql: |
      SELECT dv.division_name, SUM(j.debit_amount) AS debit_amount,
             SUM(j.debit_amount) / SUM(SUM(j.debit_amount)) OVER () AS share
      FROM journal_lines j
      JOIN accounts a ON a.account_id = j.account_id
      LEFT JOIN cost_centres cc ON cc.cost_centre_id = j.cost_centre_id
      LEFT JOIN divisions dv ON dv.division_id = cc.division_id
      JOIN calendar c ON c.date_key = j.posting_date_key
      WHERE a.account_type = 'Expense'
