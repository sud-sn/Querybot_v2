domain: finance
today: 2026-06-15
questions:
  - id: finance-001
    question: "What was revenue in fiscal 2025?"
    tags: [value, fiscal]
    plan:
      intent: value
      measures: [{agg: sum, column: journal_lines.credit_amount}]
      filters:
        - {column: accounts.account_type, op: eq, values: ["Revenue"]}
      time:
        date: journal_lines.posting_date_key
        window: {kind: between, start: "2024-07-01", end: "2025-06-30"}
    reference_sql: |
      SELECT SUM(j.credit_amount) AS credit_amount
      FROM journal_lines j
      JOIN accounts a ON a.account_id = j.account_id
      JOIN calendar c ON c.date_key = j.posting_date_key
      WHERE a.account_type = 'Revenue'
        AND c.full_date >= DATE '2024-07-01' AND c.full_date < DATE '2025-07-01'
    expect: {order_matters: false, notes: ["fiscal 2025 is July 2024 to June 2025"]}

  - id: finance-002
    question: "Monthly expenses in fiscal 2026"
    tags: [trend, A2, A7]
    plan:
      intent: trend
      measures: [{agg: sum, column: journal_lines.debit_amount}]
      filters:
        - {column: accounts.account_type, op: eq, values: ["Expense"]}
      time:
        date: journal_lines.posting_date_key
        grain: month
        window: {kind: between, start: "2025-07-01", end: "2026-06-30"}
    reference_sql: |
      SELECT DATE_TRUNC('month', c.full_date)::DATE AS period, SUM(j.debit_amount) AS debit_amount
      FROM journal_lines j
      JOIN accounts a ON a.account_id = j.account_id
      JOIN calendar c ON c.date_key = j.posting_date_key
      WHERE a.account_type = 'Expense'
        AND c.full_date >= DATE '2025-07-01' AND c.full_date < DATE '2026-07-01'
      GROUP BY 1
      ORDER BY 1
    expect: {order_matters: true, row_count: 12, partial_periods: ["2026-06-01"]}

  - id: finance-003
    question: "net amount by account type in fiscal 2026"
    tags: [breakdown]
    plan:
      intent: breakdown
      measures: [{agg: sum, column: journal_lines.net_amount}]
      group_by: [accounts.account_type]
      time:
        date: journal_lines.posting_date_key
        window: {kind: between, start: "2025-07-01", end: "2026-06-30"}
    reference_sql: |
      SELECT a.account_type, SUM(j.net_amount) AS net_amount
      FROM journal_lines j
      LEFT JOIN accounts a ON a.account_id = j.account_id
      JOIN calendar c ON c.date_key = j.posting_date_key
      WHERE c.full_date >= DATE '2025-07-01' AND c.full_date < DATE '2026-07-01'
      GROUP BY 1
    expect: {order_matters: false, notes: ["credits are negative: revenue sums below zero"]}

  - id: finance-004
