  - id: finance-014
    question: "Which cost centres' expenses grew the most from April to May 2026?"
    tags: [compare, rank, A8]
    plan:
      intent: compare
      measures: [{agg: sum, column: journal_lines.debit_amount}]
      group_by: [cost_centres.cost_centre_name]
      filters:
        - {column: accounts.account_type, op: eq, values: ["Expense"]}
      time:
        date: journal_lines.posting_date_key
        window: {kind: between, start: "2026-05-01", end: "2026-05-31"}
        compare: {kind: window, window: {kind: between, start: "2026-04-01", end: "2026-04-30"}}
      sort: [{by: change, desc: true}]
    reference_sql: |
      SELECT cc.cost_centre_name,
             SUM(CASE WHEN c.full_date < DATE '2026-05-01' THEN j.debit_amount END) AS debit_before,
             SUM(CASE WHEN c.full_date >= DATE '2026-05-01' THEN j.debit_amount END) AS debit_amount,
             COALESCE(SUM(CASE WHEN c.full_date >= DATE '2026-05-01' THEN j.debit_amount END), 0)
               - COALESCE(SUM(CASE WHEN c.full_date < DATE '2026-05-01' THEN j.debit_amount END), 0) AS change
      FROM journal_lines j
      JOIN accounts a ON a.account_id = j.account_id
      LEFT JOIN cost_centres cc ON cc.cost_centre_id = j.cost_centre_id
      JOIN calendar c ON c.date_key = j.posting_date_key
      WHERE a.account_type = 'Expense'
        AND c.full_date >= DATE '2026-04-01' AND c.full_date < DATE '2026-06-01'
      GROUP BY 1
      ORDER BY change DESC, cc.cost_centre_name
    expect: {order_matters: true}

