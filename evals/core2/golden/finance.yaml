  - id: finance-007
    question: "Expense budget against actual by cost centre for fiscal 2026"
    tags: [breakdown, two-facts]
    plan:
      intent: breakdown
      measures:
        - {agg: sum, column: budgets.budget_amount}
        - {agg: sum, column: journal_lines.debit_amount}
      group_by: [cost_centres.cost_centre_name]
      filters:
        - {column: accounts.account_type, op: eq, values: ["Expense"]}
      time:
        window: {kind: between, start: "2025-07-01", end: "2026-06-30"}
    reference_sql: |
      WITH b AS (
        SELECT cc.cost_centre_name, SUM(b.budget_amount) AS budget_amount
        FROM budgets b
        JOIN accounts a ON a.account_id = b.account_id
        LEFT JOIN cost_centres cc ON cc.cost_centre_id = b.cost_centre_id
        WHERE a.account_type = 'Expense' AND b.period_key BETWEEN 202507 AND 202606
        GROUP BY 1),
      x AS (
        SELECT cc.cost_centre_name, SUM(j.debit_amount) AS debit_amount
        FROM journal_lines j
        JOIN accounts a ON a.account_id = j.account_id
        LEFT JOIN cost_centres cc ON cc.cost_centre_id = j.cost_centre_id
        JOIN calendar c ON c.date_key = j.posting_date_key
        WHERE a.account_type = 'Expense'
          AND c.full_date >= DATE '2025-07-01' AND c.full_date < DATE '2026-07-01'
        GROUP BY 1)
      SELECT COALESCE(b.cost_centre_name, x.cost_centre_name) AS cost_centre_name, b.budget_amount, x.debit_amount
      FROM b FULL JOIN x ON b.cost_centre_name = x.cost_centre_name
    expect: {order_matters: false, row_count: 12, notes: ["each total on its own table, then side by side"]}

