  - id: finance-018
    question: "What share of fiscal 2025 expenses did each division have?"
    tags: [share]
    plan:
      intent: share
      measures: [{agg: sum, column: journal_lines.debit_amount}]
      group_by: [divisions.division_name]
      filters:
        - {column: accounts.account_type, op: eq, values: ["Expense"]}
