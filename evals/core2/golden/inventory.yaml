    reference_sql: |
      SELECT ISODOW(m.movement_ts) AS day_of_week, SUM(m.quantity) AS quantity
      FROM stock_movements m
      WHERE m.movement_type = 'RCV'
        AND m.movement_ts >= DATE '2025-01-01' AND m.movement_ts < DATE '2026-01-01'
      GROUP BY 1
    expect: {order_matters: false, row_count: 7}

