<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="QueryBot">
  <!--
    QueryBot mark — a speech bubble with the answer already inside it.

    The previous mark was a stroked Q whose counter was empty: honest, but it
    said only "ask". This one says both halves of the product in one shape: a
    filled bubble (the question) with three ascending bars cut out of it (the
    data that comes back). The bars are CUT, not painted — they reveal the tile
    through the glyph, so the mark stays a single-colour silhouette that
    survives any ground.

    The tail is still a closed filled shape, never a straight open stroke — a
    straight diagonal leaving a circle reads as a magnifying-glass handle no
    matter how it is tuned, which is the trap every earlier redesign fell into.
    Here the tail is two outward-bowed quadratics meeting at a rounded tip at
    48 degrees; it cannot be read as a handle because it is part of the fill.

    Geometry computed, not eyeballed: bubble r=12.6 at (20,19.2); the tail
    spans 26..70 degrees with every arc endpoint ON the circle (the draft had
    one 1.2 units off, which the browser silently "fixed" by inflating the
    closing arc). Margins 6.6 / 7.4 / 6.95 / 6.31. Bars share one baseline at
    y=24.6 and their farthest corner sits at r=9.77, leaving 2.8 of glyph
    around every cut — which is what keeps the bars legible at 16px.

    The gradient lives ONLY in this standalone file. The inline component keeps
    a flat token fill so its states can recolour with one custom property and
    the whole mark rebrands with the design system; a gradient cannot do
    either. Two stops inside one hue family — the old blue-to-violet banded
    into mud at favicon size, and that is why it was removed.

    This file is the favicon and the avatar on every assistant message, so it
    animates ONCE on load and then rests. Forty marks animating out of sync
    down a conversation is noise. Animation is declared inside the file because
    host stylesheets and custom properties do not reach an SVG loaded through
    <img>.
  -->
  <defs>
    <linearGradient id="qbTile" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16332B"/>
      <stop offset="1" stop-color="#0B1A15"/>
    </linearGradient>
    <linearGradient id="qbGlyph" x1="9" y1="8" x2="33" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FDCBD"/>
      <stop offset="1" stop-color="#10A088"/>
    </linearGradient>
  </defs>

  <style>
    .qb-bubble { transform-box: view-box; transform-origin: 20px 20px; }
    .qb-bar    { transform-box: fill-box; transform-origin: bottom center; }

    .qb-bubble { animation: qb-pop .5s cubic-bezier(.34,1.4,.4,1) both; }
    .qb-bar    { animation: qb-rise .45s cubic-bezier(.22,.8,.26,1) both; }
    .qb-bar:nth-of-type(2) { animation-delay: .1s; }
    .qb-bar:nth-of-type(3) { animation-delay: .18s; }

    @keyframes qb-pop  { from { opacity: 0; transform: scale(.62) } to { opacity: 1; transform: scale(1) } }
    @keyframes qb-rise { from { transform: scaleY(.15) } to { transform: scaleY(1) } }

    @media (prefers-reduced-motion: reduce) {
      .qb-bubble, .qb-bar { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <rect width="40" height="40" rx="9" fill="url(#qbTile)"/>
  <rect x="0.5" y="0.5" width="39" height="39" rx="8.5" fill="none" stroke="#FFFFFF" stroke-opacity=".07"/>

  <g class="qb-bubble">
    <!-- Body and tail, one closed fill -->
    <path fill="url(#qbGlyph)"
          d="M31.32 24.72 A12.6 12.6 0 1 0 24.31 31.04 Q27.6 32.36 33.05 33.69 Q32.61 29.05 31.32 24.72 Z"/>
    <!-- The answer: three bars cut through to the tile -->
    <rect class="qb-bar" x="13.4" y="18.2" width="3.4" height="6.4"  rx="1.7" fill="url(#qbTile)"/>
    <rect class="qb-bar" x="18.3" y="15.2" width="3.4" height="9.4"  rx="1.7" fill="url(#qbTile)"/>
    <rect class="qb-bar" x="23.2" y="12.0" width="3.4" height="12.6" rx="1.7" fill="url(#qbTile)"/>
  </g>
</svg>
