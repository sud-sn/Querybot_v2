<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="QueryBot">
  <!--
    QueryBot mark — a Q that is also a speech bubble.

    The ring is the letter's bowl; the pointer at 4 o'clock is both the Q's tail
    and the tail of a bubble. That is the point: every earlier attempt put a
    straight diagonal stroke there, and a straight diagonal leaving a circle is
    a magnifying-glass handle no matter how it is tuned — start it deeper, make
    it shorter, make it longer, it stays a lens. A triangle cannot be read that
    way. It also changes what the mark says, from "search your data" to "ask a
    question", which is the product.

    Dropped from the original mark: the blue-to-violet gradient (which bands
    into mud at favicon size), the magnifying glass, and the four-pointed
    sparkle, which is Gemini's glyph by now.

    Geometry verified rather than eyeballed: bowl r=10.2 with a 4.4 stroke, and
    the composite sits on even 5.92 / 7.60 margins in the 40 canvas.

    NO DOTS HERE. The animated component carries three dots inside the counter
    that appear only while the product is working — a typing indicator that
    stretches into bars as the answer streams. This file is the favicon *and*
    the avatar on every assistant message, so it stays the resting mark: bowl
    and pointer, legible at 16px, drawn once and then still. Forty marks
    animating out of sync down a conversation is noise, not life. Animation is
    declared inside the file because custom properties and host stylesheets do
    not reach an SVG loaded through <img>.
  -->
  <style>
    .qb-tile    { fill: #12211D; }
    .qb-bowl    { fill: none; stroke: #1FBFA4; stroke-width: 4.4; }
    .qb-pointer { fill: #1FBFA4; transform-box: view-box; transform-origin: 26.74px 26.58px; }

    /* 2*pi*10.2 = 64.09 */
    .qb-bowl    { stroke-dasharray: 64.1; animation: qb-draw .72s cubic-bezier(.22,.8,.26,1) both; }
    .qb-pointer { animation: qb-out .4s .46s cubic-bezier(.22,.8,.26,1) both; }

    @keyframes qb-draw { from { stroke-dashoffset: 64.1; opacity: .35 } to { stroke-dashoffset: 0; opacity: 1 } }
    @keyframes qb-out  { from { opacity: 0; transform: scale(.2) } to { opacity: 1; transform: scale(1) } }

    @media (prefers-reduced-motion: reduce) {
      .qb-bowl    { animation: none; stroke-dashoffset: 0; opacity: 1; }
      .qb-pointer { animation: none; opacity: 1; transform: scale(1); }
    }
  </style>

  <rect class="qb-tile" width="40" height="40" rx="7"/>

  <!-- The bowl of the Q, and the body of the bubble -->
  <circle class="qb-bowl" cx="18.32" cy="20" r="10.2"/>

  <!-- The tail of the Q, and the tail of the bubble -->
  <path class="qb-pointer" d="M29.67 22.83 34.08 32.31 23.81 30.33Z"/>
</svg>
