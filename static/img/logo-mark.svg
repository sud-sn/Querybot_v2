<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="QueryBot">
  <!--
    QueryBot mark — a Q whose tail is a terminal caret.

    The previous mark carried three things that read as generic AI
    product rather than as this product: a blue-to-violet gradient,
    a magnifying glass, and a four-pointed sparkle. All three are
    gone. A gradient also bands into mud at favicon size, and the
    sparkle is Gemini's glyph by now.

    What is left says what the product is: the ring is the Q of
    Query, and its tail is the block cursor of a prompt — you ask,
    it answers. Two flat colours, no gradient, strokes at 9% of the
    canvas so the counter stays open and the caret stays legible
    down to 16px.
  -->
  <rect width="40" height="40" rx="7" fill="#12211D"/>

  <!-- Q ring -->
  <circle cx="17.4" cy="18.4" r="8.9" fill="none" stroke="#2BD4BA" stroke-width="3.6"/>

  <!-- Caret tail: crosses the ring at 4 o'clock, where a Q's tail sits -->
  <rect x="22.4" y="22.8" width="7.8" height="10.4" rx="1.6" fill="#2BD4BA"/>
</svg>
