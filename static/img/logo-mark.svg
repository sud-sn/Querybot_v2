<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="QueryBot">
  <!--
    QueryBot mark — a Q whose tail is a terminal caret.

    The previous mark carried three things that read as generic AI product
    rather than as this product: a blue-to-violet gradient, a magnifying glass,
    and a four-pointed sparkle. All three are gone. A gradient also bands into
    mud at favicon size, and the sparkle is Gemini's glyph by now.

    What is left says what the product is: the ring is the Q of Query, and its
    tail is the block cursor of a prompt — you ask, it answers. Two flat
    colours, no gradient, strokes at 9% of the canvas so the counter stays open
    and the caret stays legible down to 16px.

    MOTION. This file is the favicon *and* the avatar on every assistant
    message, so it draws itself in once and then holds still. Forty carets
    blinking out of sync down a conversation would be noise, not life — the
    resting blink belongs to the single-instance brand moments (sign-in,
    loaders, the composer indicator), which are driven by brand-motion.css.
    Animation is declared inside the file because CSS custom properties and
    host stylesheets do not reach an SVG loaded through <img>.
  -->
  <style>
    .qb-tile  { fill: #12211D; }
    .qb-glyph { fill: none; stroke: #1FBFA4; stroke-width: 3.6; }
    .qb-caret { fill: #1FBFA4; }

    /* 2πr for r=8.9 */
    .qb-glyph {
      stroke-dasharray: 55.9;
      animation: qb-draw .62s cubic-bezier(.22, .8, .26, 1) both;
    }
    .qb-caret {
      transform-box: fill-box;
      transform-origin: center;
      animation: qb-land .42s .34s cubic-bezier(.22, .8, .26, 1) both;
    }
    @keyframes qb-draw {
      from { stroke-dashoffset: 55.9; opacity: .35; }
      to   { stroke-dashoffset: 0;    opacity: 1; }
    }
    @keyframes qb-land {
      from { transform: scale(.35); opacity: 0; }
      60%  { transform: scale(1.18); opacity: 1; }
      to   { transform: scale(1);   opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .qb-glyph, .qb-caret { animation: none; stroke-dashoffset: 0; opacity: 1; }
    }
  </style>

  <rect class="qb-tile" width="40" height="40" rx="7"/>

  <!-- Q ring -->
  <circle class="qb-glyph" cx="17.4" cy="18.4" r="8.9"/>

  <!-- Caret tail: crosses the ring at 4 o'clock, where a Q's tail sits -->
  <rect class="qb-caret" x="22.4" y="22.8" width="7.8" height="10.4" rx="1.6"/>
</svg>
