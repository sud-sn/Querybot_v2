<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="QueryBot">
  <!--
    QueryBot mark — a Q whose bowl is a donut chart.

    The muted track is the whole; the brighter arc is the measured part; the
    three ascending bars in the counter are the analysis; the diagonal stroke at
    4 o'clock is the Q's tail. The donut's opening is the remainder and is
    deliberate — an earlier version had an accidental hairline gap there,
    because the dash length was rounded to 58.4 against a true circumference of
    58.4336. The track carries no dasharray now, so the ring cannot fail to
    close.

    Dropped from the original mark: the blue-to-violet gradient (which bands
    into mud at favicon size), the magnifying glass, and the four-pointed
    sparkle, which is Gemini's glyph by now.

    Geometry verified rather than eyeballed: r=10.2 with a 4.4 stroke gives an
    inner counter radius of 8.00, and the furthest bar corner sits at 7.57.

    MOTION. This file is the favicon *and* the avatar on every assistant
    message, so it draws itself in once and then holds. Forty marks animating
    out of sync down a conversation is noise, not life — the resting motion
    belongs to the single-instance brand moments (sign-in, loaders, the composer
    indicator), which brand-motion.css drives. Animation is declared inside the
    file because custom properties and host stylesheets do not reach an <img>.
  -->
  <style>
    .qb-tile { fill: #12211D; }
    .qb-track, .qb-value, .qb-tail {
      fill: none; stroke-width: 4.4;
      transform-box: fill-box; transform-origin: center;
    }
    .qb-track { stroke: #1FBFA4; stroke-opacity: .34; }
    .qb-value { stroke: #1FBFA4; stroke-linecap: butt; }
    .qb-tail  { stroke: #1FBFA4; stroke-linecap: round; stroke-linejoin: round; }
    .qb-bar   { fill: #1FBFA4; transform-box: fill-box; transform-origin: bottom center; }

    /* 2*pi*10.2 = 64.09; 44.9 of it is ~70%. The tail's own length is 9.9. */
    .qb-value {
      stroke-dasharray: 44.9 19.2;
      transform: rotate(-90deg);            /* start the arc at twelve o'clock */
      animation: qb-arc .72s cubic-bezier(.22,.8,.26,1) both;
    }
    .qb-tail { stroke-dasharray: 9.9; animation: qb-tail .3s .6s cubic-bezier(.22,.8,.26,1) both; }
    .qb-bar  { animation: qb-rise .42s cubic-bezier(.22,.8,.26,1) both; }
    .qb-bar:nth-of-type(1) { animation-delay: .18s; }
    .qb-bar:nth-of-type(2) { animation-delay: .28s; }
    .qb-bar:nth-of-type(3) { animation-delay: .38s; }

    @keyframes qb-arc  { from { stroke-dashoffset: 44.9; opacity: .35 } to { stroke-dashoffset: 0; opacity: 1 } }
    @keyframes qb-tail { from { stroke-dashoffset: 9.9 }  to { stroke-dashoffset: 0 } }
    @keyframes qb-rise { from { transform: scaleY(0); opacity: 0 } to { transform: scaleY(1); opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      .qb-value, .qb-tail, .qb-bar {
        animation: none; stroke-dashoffset: 0; opacity: 1;
      }
      .qb-value { transform: rotate(-90deg); }
      .qb-bar   { transform: scaleY(1); }
    }
  </style>

  <rect class="qb-tile" width="40" height="40" rx="7"/>

  <!-- Q bowl as a donut: the whole, then the measured part -->
  <circle class="qb-track" cx="18" cy="18" r="10.2"/>
  <circle class="qb-value" cx="18" cy="18" r="10.2"/>

  <!-- The analysis, inside the counter -->
  <rect class="qb-bar" x="12.8" y="17.8" width="2.8" height="4.2" rx="1"/>
  <rect class="qb-bar" x="16.6" y="15.6" width="2.8" height="6.4" rx="1"/>
  <rect class="qb-bar" x="20.4" y="13.4" width="2.8" height="8.6" rx="1"/>

  <!-- Q tail -->
  <path class="qb-tail" d="M23 23 30 30"/>
</svg>
