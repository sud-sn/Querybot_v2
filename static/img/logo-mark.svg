<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Solviz">
  <!--
    Solviz mark: two corner brackets (the frame a question is asked in) and a
    dot at the centre (the answer found in it). One drawing at every size, on
    a 32-unit grid: the brackets are 3.6 wide with round ends, the dot has a
    4.2 radius. At 16px a bracket is 1.8px and the dot 4.2px across, so the
    mark holds at favicon size and no second "small" drawing is needed.

    Flat, no tile and no gradient. The brackets are Primary (#2151CA, 6.8:1
    on white) and the dot turmeric; in a dark browser the brackets turn to
    the shell's accent (#93ADF6) and the dot to the brighter turmeric.

    This file is the favicon and any <img> of the mark. Pages draw the mark
    inline with the brand_motion macro, from the same geometry, so a state
    can move its dot. It never animates here.
  -->
  <style>
    .qb-glyph { stroke: #2151CA; }
    .qb-dot { fill: #E59D12; }
    @media (prefers-color-scheme: dark) { .qb-glyph { stroke: #93ADF6; } .qb-dot { fill: #F7B63C; } }
  </style>
  <g class="qb-glyph" fill="none" stroke-width="3.6" stroke-linecap="round">
    <path d="M6.5 14V10a3.5 3.5 0 0 1 3.5-3.5h4"/>
    <path d="M25.5 18v4a3.5 3.5 0 0 1-3.5 3.5h-4"/>
  </g>
  <circle class="qb-dot" cx="16" cy="16" r="4.2"/>
</svg>
