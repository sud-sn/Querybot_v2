# `python -m pytest -q` collected 8140 tests and ran NONE of them:
# deploy/test_bot_ceo.py is an ad-hoc script against one operator's
# machine, it chdirs to an absolute path at import time, and pytest
# collects it because of its name. One FileNotFoundError during
# collection interrupts the whole run, so the documented command was a
# no-op that looked like a pass.
[pytest]
testpaths = tests
norecursedirs = deploy clients evals/clients .git venv
