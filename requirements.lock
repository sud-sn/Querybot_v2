# requirements.lock -- the exact versions CI tests and deploy.sh installs.
# Linux x86_64, Python 3.11: resolved for that platform, and it pins
# Linux-only wheels (uvloop, cuda-bindings). Windows installs still go
# through requirements-windows.txt and are NOT pinned by this file.
#
# GENERATED. Edit requirements.txt (the ranges a human chooses), then
# regenerate this file and let CI prove it before anything deploys it:
#
#   python3.11 -m venv /tmp/lock && /tmp/lock/bin/pip install --dry-run \
#       --ignore-installed --report /tmp/lock.json \
#       -c requirements.lock -r requirements.txt
#
# and rewrite this file from the report's "install" list, keeping the
# exclusions below. Dropping `-c requirements.lock` re-resolves everything to
# the newest compatible release -- sometimes that is the point, but then the
# whole suite has to go green on the result before it is committed.
#
# Why this file exists: requirements.txt had no exact pins, so every deploy
# resolved whatever was newest that day, and the environment the test suite
# had always run in did not even satisfy it -- cryptography 41.0.7 against a
# declared >=42.0.0, and six of the 23 requirements (psycopg2-binary,
# snowflake-connector-python, oracledb, pyodbc, sentence-transformers,
# statsmodels) not installed at all. With statsmodels absent, eight forecast
# tests always skipped: the ETS and SARIMAX paths production actually runs had
# never been executed by the suite.
#
# Excluded on purpose: 17 CUDA packages -- the nvidia-* libraries,
# triton and cuda-toolkit. They belong to PyPI's Linux torch build, which pins
# each of them to an exact version itself, so a deploy installing
# torch==2.14.0 still gets a fully determined set. CI installs the CPU-only
# build of the same torch version from download.pytorch.org, which needs none of
# them. cuda-bindings and cuda-pathfinder stay pinned below: torch asks for
# cuda-bindings by RANGE, so leaving it out would let deploys drift.
#
# 112 distributions.
