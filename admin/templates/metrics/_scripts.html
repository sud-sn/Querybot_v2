// LIVE BACKEND VALIDATOR — calls /metrics/validate and shows inline result
// ══════════════════════════════════════════════════════════════════════
async function liveValidate(btn){
  var form        = btn.closest(".metric-form");
  _syncMetricBuilder(form);
  var editor      = form ? form.querySelector(".formula-editor") : null;
  var resultPanel = form ? form.querySelector(".validate-result") : null;
  if(!editor || !editor.value.trim()){
    if(resultPanel){ resultPanel.className="validate-result show warn"; resultPanel.innerHTML="Write a formula first."; }
    return;
  }
  var origText = btn.textContent;
  btn.disabled = true; btn.textContent = "…";
  if(resultPanel){ resultPanel.className="validate-result show"; resultPanel.innerHTML="Validating…"; }
  try {
    var clientMatch = location.pathname.match(/\/clients\/([^/]+)\//);
    if(!clientMatch) throw new Error("Cannot determine account from URL");
    var payload = {
      sql_template:  editor.value.trim(),
      formula_type:  (form.querySelector(".formula-type-select")||{}).value || "expression",
      required_columns: (form.querySelector("[name='required_columns']")||{}).value || "",
      base_table:    (form.querySelector("[name='base_table']")||{}).value || "",
      base_entity:   (form.querySelector("[name='base_entity']")||{}).value || "",
    };
    var resp = await fetch("/admin/clients/"+clientMatch[1]+"/metrics/validate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    if(!resp.ok) throw new Error("Server error "+resp.status);
    var data = await resp.json();
    var html = "";
    if(data.errors && data.errors.length){
      html += data.errors.map(function(e){ return "<div>✗ "+escHtml(e)+"</div>"; }).join("");
    }
    if(data.warnings && data.warnings.length){
      html += data.warnings.map(function(w){ return "<div>⚠ "+escHtml(w)+"</div>"; }).join("");
    }
    if(data.valid && !data.warnings.length){
      html = "<div>✓ Validation passed — metric is ready to save.</div>";
    } else if(data.valid){
      html = "<div>✓ Valid with warnings:</div>" + html;
    }
    var cls = data.valid ? (data.warnings && data.warnings.length ? "warn" : "ok") : "fail";
    if(resultPanel){ resultPanel.className="validate-result show "+cls; resultPanel.innerHTML=html; }
  } catch(err){
    if(resultPanel){ resultPanel.className="validate-result show fail"; resultPanel.innerHTML="✗ "+escHtml(err.message); }
  } finally {
    btn.disabled = false; btn.textContent = origText;
  }
}
window.liveValidate = liveValidate;

/* The FIELD BROWSER that lived here is gone. It was the predecessor of the
   Fields panel in the metric dialog (#mc-fields-list, _buildMcFieldsList) and
   had stopped shipping: nothing rendered #colBrowserList, so `if(!list) return;`
   swallowed every call and the panel silently did not exist.

   The survivor is strictly better -- grouped by table with collapsible groups,
   type badges, a live column count, and escHtml on every interpolation, where
   this one wrote c.column raw into an onclick attribute. Giving it a container
   would have put a second, worse column picker beside the working one. Typing a
   column into a formula is still served by the #formula-col-suggest typeahead,
   live on both the dialog and the inline edit forms. */

// Load columns from API on page load
(function loadColumns(){
  document.querySelectorAll(".metric-form").forEach(_ensureMetricUxPanels);
  var m = window.location.pathname.match(/\/clients\/([^\/]+)/);
  if(!m) return;
  fetch("/admin/clients/"+m[1]+"/api/columns")
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.status === "ok" && data.columns && data.columns.length){
        _allColumns = data.columns;
        _buildDupSet();
        _buildMcFieldsList(_allColumns);
        _populateTimeColSelects(_allColumns);
        _populateBaseTableInputs(_allColumns);
        _wireMetricBuilderColumnLists(document);
        document.querySelectorAll(".metric-builder").forEach(_initialiseMetricBuilder);
        document.querySelectorAll(".metric-form").forEach(_scheduleMetricBuilderBaseTableInference);
        document.querySelectorAll(".metric-form").forEach(_ensureMetricUxPanels);
        // Re-color already-typed identifiers now that real column names are known
        document.querySelectorAll(".formula-editor,.metric-builder-row-expression").forEach(_initSqlHighlight);
      } else {
        _buildMcFieldsList([]);
      }
    })
    .catch(function(err){
      // Reset the Fields panel, or its header reads "loading..." for ever.
      console.error("column load failed:", err);
      _buildMcFieldsList([]);
    });
})();

// Populate date-type columns into time-col-select dropdowns
function _populateTimeColSelects(columns){
  var DATE_TYPES = /date|time|timestamp|datetime/i;
  // Include date-ish columns first, then all others as fallback
  var dateCols = columns.filter(function(c){ return DATE_TYPES.test(c.type||""); });
  var otherCols = columns.filter(function(c){ return !DATE_TYPES.test(c.type||""); });
  var ordered = dateCols.concat(otherCols);

  // Deduplicate by column name for add-form select (show unqualified names)
  var seen = {}, opts = ['<option value="">— none —</option>'];
  ordered.forEach(function(c){
    var label = _dupCols.has(c.column) ? c.table+"."+c.column : c.column;
    if(!seen[label]){
      seen[label] = true;
      var isDate = DATE_TYPES.test(c.type||"") ? ' data-date="1"' : "";
      opts.push('<option value="'+escHtml(c.column)+'"'+isDate+'>'+escHtml(label)
        +(c.type ? " ("+escHtml(c.type)+")" : "")+'</option>');
    }
  });
  var optHtml = opts.join("");

  // Populate add-form selects
  document.querySelectorAll(".add-time-col-select").forEach(function(sel){
    sel.innerHTML = optHtml;
  });
  // Populate edit-form selects, restoring current value
  document.querySelectorAll(".edit-time-col-select").forEach(function(sel){
    var current = sel.getAttribute("data-current") || "";
    sel.innerHTML = optHtml;
    if(current){
      // Try to select the current value; if not in list, add it
      if(!sel.querySelector('option[value="'+current+'"]')){
        sel.insertAdjacentHTML("beforeend", '<option value="'+escHtml(current)+'">'+escHtml(current)+'</option>');
      }
      sel.value = current;
    }
  });
}

// Wire base-table text inputs to show table names from schema
function _populateBaseTableInputs(columns){
  var tables = [];
  var seen = {};
  columns.forEach(function(c){
    if(c.table && !seen[c.table]){ seen[c.table]=true; tables.push(c.table); }
  });
  if(!tables.length) return;
  // Build/update a shared datalist for base-table inputs
  var dl = document.getElementById("base-table-options");
  if(!dl){
    dl = document.createElement("datalist");
    dl.id = "base-table-options";
    document.body.appendChild(dl);
  }
  dl.innerHTML = tables.map(function(t){ return '<option value="'+escHtml(t)+'">'; }).join("");
  document.querySelectorAll(".base-table-input").forEach(function(inp){
    inp.setAttribute("list","base-table-options");
  });
}

// WIRE ALL INPUT EVENTS
// ══════════════════════════════════════════════════════════════════════
document.addEventListener("focusin", function(e){
  if(e.target.matches(".formula-editor")){
    _activeEditor = e.target;
    updateFormulaHints(e.target);
    _initSqlHighlight(e.target);
    // Show autocomplete immediately for whatever token is at the cursor —
    // critical for edit forms where value is pre-filled and input never fires
    _showSuggestions(e.target, _currentToken(e.target));
  }
  if(e.target.matches(".metric-builder-row-expression")){
    _initSqlHighlight(e.target);
  }
  if(e.target.matches(".metric-builder-row-expression,.metric-builder-required-joins")){
    _showSuggestions(e.target, _currentToken(e.target));
  }
  if(e.target.matches(".metric-builder-measure,.metric-builder-field,.metric-builder-required-columns")){
    _showSuggestions(e.target, _currentToken(e.target), true);
  }
});

document.addEventListener("input", function(e){
  // Mark this builder as having live, in-progress user edits — set by a
  // real keystroke/paste (native `input` events; programmatic .value
  // assignment from _initialiseMetricBuilder/_syncMetricBuilder does NOT
  // fire input, so this only catches genuine user action). Prevents the
  // async columns-fetch callback from later clobbering unsaved edits with
  // the stale server-rendered config if it resolves after the user has
  // already started typing/pasting.
  var _mbForFlag = e.target.closest(".metric-builder");
  if(_mbForFlag) _mbForFlag.dataset.userEdited = "1";
  if(e.target.matches(".formula-editor")){
    _activeEditor = e.target;
    updateFormulaHints(e.target);
    _renderSqlHighlight(e.target);
    // ${MetricName} autocomplete takes priority when inside a metric ref
    _checkMetricRefTrigger(e.target);
    if(!_inMetricRef) _showSuggestions(e.target, _currentToken(e.target));
    // Hide live-validate panel on formula change — result is stale
    var vr = e.target.closest(".metric-form") && e.target.closest(".metric-form").querySelector(".validate-result");
    if(vr){ vr.className="validate-result"; vr.innerHTML=""; }
  }
  if(e.target.matches(".metric-builder-row-expression")){
    _renderSqlHighlight(e.target);
  }
  if(e.target.matches(".metric-builder-row-expression,.metric-builder-required-joins")){
    _showSuggestions(e.target, _currentToken(e.target));
  }
  if(e.target.matches(".metric-builder-measure,.metric-builder-field,.metric-builder-required-columns")){
    _showSuggestions(e.target, _currentToken(e.target));
  }
  if(e.target.name === "required_columns" || e.target.name === "allowed_dimensions"){
    var parts = e.target.value.split(",");
    var last  = parts[parts.length-1].trim();
    if(last.length >= 2) _showTagSuggestions(e.target, last);
    else _hideSuggestions();
    _updateMetricUxPanels(e.target.closest(".metric-form"));
  }
  if(e.target.matches(".metric-builder-measure,.metric-builder-field,.metric-builder-value,.metric-builder-row-expression,.metric-builder-required-columns,.metric-builder-required-joins,.metric-builder-dg-invalid,.metric-builder-dg-datecol")){
    _syncMetricBuilder(e.target.closest(".metric-form"));
    if(e.target.matches(".metric-builder-row-expression,.metric-builder-required-columns")){
      _scheduleMetricBuilderBaseTableInference(e.target.closest(".metric-form"));
      _scheduleAutoDateRoleJoins(e.target.closest(".metric-form"));
    }
  }
  if(e.target.matches("[name='base_table'],[name='base_entity'],[name='grain']")){
    _updateMetricUxPanels(e.target.closest(".metric-form"));
    if(e.target.matches("[name='base_table']")){
      _scheduleAutoDateRoleJoins(e.target.closest(".metric-form"));
    }
  }
});

document.addEventListener("change", function(e){
  if(e.target.matches(".formula-type-select")){
    var form   = e.target.closest(".metric-form");
    var editor = form ? form.querySelector(".formula-editor") : null;
    var label  = form ? form.querySelector(".formula-label") : null;
    if(label) label.textContent = e.target.value === "query" ? "Full SELECT query *" : "Approved formula *";
    if(editor) updateFormulaHints(editor);
    _updateMetricUxPanels(form);
  }
  if(e.target.matches(".metric-builder-mode")){
    var builder = e.target.closest(".metric-builder");
    if(builder && e.target.value === "row_calculated"){
      var rowAgg = builder.querySelector(".metric-builder-row-aggregation");
      if(rowAgg && !rowAgg.value) rowAgg.value = "AVG";
    }
    _syncMetricBuilder(e.target.closest(".metric-form"));
    _scheduleMetricBuilderBaseTableInference(e.target.closest(".metric-form"));
    _scheduleAutoDateRoleJoins(e.target.closest(".metric-form"));
  }
  if(e.target.matches(".metric-builder-enabled,.metric-builder-aggregation,.metric-builder-row-aggregation,.metric-builder-operator,.metric-builder-dg-from,.metric-builder-dg-to,.metric-builder-dg-unit,.metric-builder-dg-aggregation,.metric-builder-dg-missing")){
    _syncMetricBuilder(e.target.closest(".metric-form"));
  }
  if(e.target.matches("[name='result_format'],[name='default_time_column']")){
    _updateMetricUxPanels(e.target.closest(".metric-form"));
  }
});

document.addEventListener("submit", function(e){
  if(!e.target.matches(".metric-form")) return;
  var builder = e.target.querySelector(".metric-builder");
  var enabled = builder && (builder.querySelector(".metric-builder-enabled")||{}).checked;
  if(enabled && !_syncMetricBuilder(e.target)){
    e.preventDefault();
    qbToast.error("Metric builder is incomplete. Check the measure/row expression and valid filter or join values.");
  }
}, true);

// Hard-delete via fetch — removes row from DOM without page reload
window.deleteMetricFetch = function(id, name, btn){
  qbConfirm({
    title: 'Delete metric?',
    body: '"' + name + '" will be permanently removed from all query matching. This cannot be undone.',
    confirm: 'Delete metric',
    onConfirm: async function(){
      var m = location.pathname.match(/\/clients\/([^/]+)\//);
      if(!m){ return; }
      var url = "/admin/clients/" + m[1] + "/metrics/" + id + "/delete";
      try{
        var resp = await fetch(url, { method: "POST", headers: { "X-Requested-With": "fetch" } });
        if(resp.ok){
          var row = btn.closest(".metric-row");
          if(row){ row.style.transition = "opacity .18s,transform .18s"; row.style.opacity = "0"; row.style.transform = "translateX(6px)"; setTimeout(function(){ row.remove(); applyFilters(); }, 200); }
          window._metricsData = (window._metricsData || []).filter(function(x){ return x.id !== id; });
        } else {
          qbToast.warning("Delete failed (status " + resp.status + "). Please refresh and try again.");
        }
      } catch(err){
        qbToast.error("Delete failed: " + err.message);
      }
    }
  });
};

var _activeFilter = "all";

window.setChip = function(btn, filter){
  document.querySelectorAll(".filter-chip").forEach(function(c){ c.classList.remove("active"); });
  btn.classList.add("active");
  _activeFilter = filter;
  applyFilters();
};

window.applyFilters = function(){
  var q   = (document.getElementById("metricSearch")||{}).value || "";
  var lc  = q.toLowerCase().trim();
  var sort = (document.getElementById("metricSort")||{}).value || "name-asc";

  var cards = Array.from(document.querySelectorAll("#metricsListWrap .metric-row"));
  var visible = 0;

  cards.forEach(function(card){
    var name  = card.dataset.name        || "";
    var syns  = card.dataset.synonyms    || "";
    var desc  = card.dataset.description || "";
    var type  = card.dataset.type        || "";
    var active= card.dataset.active      || "1";
    var cat   = card.dataset.category    || "";

    // Text match
    var textOk = !lc || name.includes(lc) || syns.includes(lc) || desc.includes(lc) || cat.includes(lc);

    var status = card.dataset.status || "published";

    // Filter chip match
    var filterOk = true;
    if(_activeFilter === "expression") filterOk = type === "expression";
    else if(_activeFilter === "query") filterOk = type === "query";
    else if(_activeFilter === "inactive") filterOk = active === "0";
    else if(_activeFilter === "draft") filterOk = status === "draft";
    else if(_activeFilter !== "all"){
      // category chip
      filterOk = cat === _activeFilter;
    }

    var show = textOk && filterOk;
    card.style.display = show ? "" : "none";
    if(show) visible++;
  });

  // Sort visible cards
  var wrap = document.getElementById("metricsListWrap");
  if(wrap){
    var visCards = cards.filter(function(c){ return c.style.display !== "none"; });
    visCards.sort(function(a, b){
      if(sort === "name-desc") return b.dataset.name.localeCompare(a.dataset.name);
      if(sort === "usage-desc"){
        var diff = (parseInt(b.dataset.usage||"0",10) - parseInt(a.dataset.usage||"0",10));
        return diff || a.dataset.name.localeCompare(b.dataset.name);
      }
      if(sort === "type")      return (a.dataset.type||"").localeCompare(b.dataset.type||"");
      if(sort === "category")  return (a.dataset.category||"zz").localeCompare(b.dataset.category||"zz");
      return a.dataset.name.localeCompare(b.dataset.name); // name-asc default
    });
    visCards.forEach(function(c){ wrap.appendChild(c); });
  }

  var countEl = document.getElementById("metricsCount");
  if(countEl) countEl.textContent = visible + " of " + cards.length + " metric" + (cards.length !== 1 ? "s" : "");
  var emptyEl = document.getElementById("metricsEmpty");
  if(emptyEl) emptyEl.style.display = visible === 0 ? "block" : "none";
};

// CLONE — fill the Add form from an existing metric
// ══════════════════════════════════════════════════════════════════════
window.cloneMetric = function(id){
  var all = window._metricsData || [];
  var m   = all.find(function(x){ return x.id === id; });
  if(!m){ qbToast.error("Metric data not found."); return; }

  var addForm = document.getElementById("mc-form") || document.querySelector(".metric-form#mc-form");
  if(!addForm){ qbToast.error("Metric dialog not found on page."); return; }

  function _set(name, value){
    var el = addForm.querySelector("[name='"+name+"']");
    if(!el) return;
    el.value = value || "";
  }

  _set("name",                (m.name || "") + "_copy");
  _set("synonyms",            m.synonyms || "");
  _set("sql_template",        m.sql_template || "");
  _set("description",         m.description || "");
  _set("grain",               m.grain || "");
  _set("required_columns",    m.required_columns || "");
  _set("allowed_dimensions",  m.allowed_dimensions || "");
  _set("metric_builder_config", m.metric_builder_config || "");
  _set("example_questions",   m.example_questions || "");
  _set("category",            m.category || "");
  _set("default_time_column", m.default_time_column || "");
  _set("base_table",          m.base_table || "");
  _set("base_entity",         m.base_entity || "");
  _set("result_format",       m.result_format || "number");
  _set("formula_type",        m.formula_type || "expression");

  // Fire change on formula_type select so label updates
  var typeSelect = addForm.querySelector(".formula-type-select");
  if(typeSelect){
    typeSelect.value = m.formula_type || "expression";
    typeSelect.dispatchEvent(new Event("change"));
  }

  var builder = addForm.querySelector(".metric-builder");
  if(builder){
    builder.querySelector(".metric-builder-enabled").checked = false;
    builder.classList.remove("enabled");
    var list = builder.querySelector(".metric-filter-list");
    if(list) list.innerHTML = "";
    _initialiseMetricBuilder(builder);
  }
  _ensureMetricUxPanels(addForm);

  // Trigger validator on formula editor
  var editor = addForm.querySelector(".formula-editor");
  if(editor) updateFormulaHints(editor);

  // Wizard: all steps reviewable immediately for a clone, mode card matched
  // to the cloned config, dialog keeps this state instead of resetting.
  var _cloneCfgMode = "";
  try{ _cloneCfgMode = (JSON.parse(m.metric_builder_config || "{}") || {}).mode || ""; }catch(e){}
  _mcVisited = {1:true, 2:true, 3:true};
  _mcSelectCardForConfig(addForm, _cloneCfgMode, m.formula_type || "expression");
  window._mcSkipReset = true;

  // Open the dialog with cloned data and focus the name input
  openMetricDialog();
  _mcSetStep(1);
  setTimeout(function(){
    var nameInput = addForm.querySelector("[name='name']");
    if(nameInput){ nameInput.focus(); nameInput.select(); }
  }, 120);
};

// EXPORT METRICS AS JSON
// ══════════════════════════════════════════════════════════════════════
window.exportMetricsJSON = function(){
  var all = window._metricsData || [];
  if(!all.length){ qbToast.warning("No metrics to export."); return; }
  var cleaned = all.map(function(m){
    return {
      name:                m.name,
      synonyms:            m.synonyms,
      description:         m.description,
      formula_type:        m.formula_type,
      sql_template:        m.sql_template,
      result_format:       m.result_format,
      grain:               m.grain,
      required_columns:    m.required_columns,
      allowed_dimensions:  m.allowed_dimensions,
      metric_builder_config: m.metric_builder_config,
      example_questions:   m.example_questions,
      category:            m.category,
      default_time_column: m.default_time_column,
      base_table:          m.base_table,
      base_entity:         m.base_entity,
      is_active:           m.is_active,
    };
  });
  var blob = new Blob([JSON.stringify(cleaned, null, 2)], { type: "application/json" });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href   = url;
  a.download = "metrics_export.json";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
};

// ══════════════════════════════════════════════════════════════════════
// CREATE WIZARD — step navigation, mode cards, review refresh
// ══════════════════════════════════════════════════════════════════════
var _mcVisited = {1:true};

function _mcForm(){ return document.getElementById("mc-form"); }

function _mcValidateStep(n){
  var form = _mcForm();
  if(!form) return true;
  if(n === 1){
    var nm = form.querySelector("[name='name']");
    if(nm && !nm.value.trim()){ nm.reportValidity(); return false; }
    return true;
  }
  if(n === 2){
    if(!form.dataset.mcMode){
      if(window.qbToast && qbToast.warning) qbToast.warning("Pick how this metric is calculated first.");
      else qbToast.warning("Pick how this metric is calculated first.");
      return false;
    }
    var en = form.querySelector(".metric-builder-enabled");
    if(en && en.checked) return _syncMetricBuilder(form);
    var ed = form.querySelector(".formula-editor");
    if(ed && !ed.value.trim()){
      if(window.qbToast && qbToast.warning) qbToast.warning("Write the formula before continuing.");
      ed.focus();
      return false;
    }
    return true;
  }
  return true;
}

window._mcGoToStep = function(n){
  var form = _mcForm();
  if(!form) return;
  n = Math.max(1, Math.min(3, n));
  var cur = parseInt(form.dataset.step || "1", 10);
  if(n > cur){
    for(var s = cur; s < n; s++){
      if(!_mcValidateStep(s)){ _mcSetStep(s); return; }
      _mcVisited[s + 1] = true;
    }
  } else if(n < cur){
    // going back is always allowed
  } else {
    return;
  }
  if(!_mcVisited[n]) return;   // direct jumps only to visited steps
  _mcSetStep(n);
};

function _mcSetStep(n){
  var form = _mcForm();
  if(!form) return;
  form.dataset.step = String(n);
  _mcUpdateStepper();
  if(n === 3) _mcRefreshReview(form);
  var first = form.querySelector('.mc-step[data-step="' + n + '"] input:not([type="hidden"]), .mc-step[data-step="' + n + '"] textarea');
  if(first) setTimeout(function(){ try{ first.focus({preventScroll:true}); }catch(e){} }, 50);
}

function _mcUpdateStepper(){
  var form = _mcForm();
  if(!form) return;
  var cur = parseInt(form.dataset.step || "1", 10);
  form.querySelectorAll(".mc-wizard-bar .wizard-step").forEach(function(stepEl){
    var sn = parseInt(stepEl.dataset.goto, 10);
    stepEl.classList.toggle("active", sn === cur);
    stepEl.classList.toggle("done", sn < cur);
    stepEl.classList.toggle("visited", !!_mcVisited[sn]);
    var line = stepEl.querySelector(".wizard-step-line");
    if(line) line.classList.toggle("done", sn < cur);
  });
}

function _mcApplyMode(form, mode, formulaType){
  form.dataset.mcMode = mode;
  var ft = form.querySelector(".formula-type-select");
  if(ft && ft.value !== formulaType){
    ft.value = formulaType;
    ft.dispatchEvent(new Event("change", {bubbles:true}));
  }
  var en = form.querySelector(".metric-builder-enabled");
  var noCode = (mode === "aggregate" || mode === "date_gap" || mode === "row_calculated");
  if(en && en.checked !== noCode){
    en.checked = noCode;
    en.dispatchEvent(new Event("change", {bubbles:true}));
  }
  if(noCode){
    var ms = form.querySelector(".metric-builder-mode");
    if(ms && ms.value !== mode){
      ms.value = mode;
      ms.dispatchEvent(new Event("change", {bubbles:true}));
    }
  }
}

window.selectMcModeCard = function(card){
  var form = card.closest(".metric-form") || _mcForm();
  if(!form) return;
  var mode = card.dataset.mode;
  form.querySelectorAll(".mc-mode-card").forEach(function(c){ c.classList.toggle("selected", c === card); });
  var rowChipOn = !!form.querySelector('.mc-row-subtoggle [data-rowmode="1"].active');
  var effective = (mode === "expression" && rowChipOn) ? "row_calculated" : mode;
  _mcApplyMode(form, effective, mode === "query" ? "query" : "expression");
};

window.selectMcRowMode = function(chip){
  var form = chip.closest(".metric-form");
  if(!form) return;
  form.querySelectorAll(".mc-row-subtoggle .ui-chip").forEach(function(c){ c.classList.toggle("active", c === chip); });
  var perRow = chip.dataset.rowmode === "1";
  _mcApplyMode(form, perRow ? "row_calculated" : "expression", "expression");
};

function _mcSelectCardForConfig(form, builderMode, formulaType){
  var cardMode = (formulaType === "query") ? "query"
    : (builderMode === "aggregate" || builderMode === "date_gap") ? builderMode
    : "expression";
  var rowChip = form.querySelector('.mc-row-subtoggle [data-rowmode="' + (builderMode === "row_calculated" ? "1" : "0") + '"]');
  if(rowChip){
    form.querySelectorAll(".mc-row-subtoggle .ui-chip").forEach(function(c){ c.classList.toggle("active", c === rowChip); });
  }
  var card = form.querySelector('.mc-mode-card[data-mode="' + cardMode + '"]');
  if(card) selectMcModeCard(card);
}

function _mcRefreshReview(form){
  var pre = form.querySelector("[data-mc-review-formula]");
  if(pre){
    var ed = form.querySelector(".formula-editor");
    pre.textContent = (ed && ed.value.trim()) || "—";
  }
  _updateMetricUxPanels(form);
}

// Enter on steps 1–2 advances instead of implicitly submitting the form.
document.addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  var form = e.target.closest && e.target.closest("#mc-form");
  if(!form || e.target.tagName === "TEXTAREA") return;
  var step = parseInt(form.dataset.step || "1", 10);
  if(step !== 3){
    e.preventDefault();
    _mcGoToStep(step + 1);
  }
});

// Save is only valid once steps 1–2 pass — jump back with the browser's
// own validity UI instead of a silent "not focusable" submit failure.
document.addEventListener("submit", function(e){
  if(e.target.id !== "mc-form") return;
  if(!_mcValidateStep(1)){ e.preventDefault(); _mcSetStep(1); return; }
  if(!_mcValidateStep(2)){ e.preventDefault(); _mcSetStep(2); return; }
}, true);

// METRIC CREATION DIALOG — open / close
// ══════════════════════════════════════════════════════════════════════
window.openMetricDialog = function(){
  var ov = document.getElementById("mc-overlay");
  if(!ov) return;
  ov.classList.add("open");
  document.body.style.overflow = "hidden";
  var form = document.getElementById("mc-form");
  if(form){
    if(!window._mcSkipReset){
      form.dataset.step = "1";
      delete form.dataset.mcMode;
      form.querySelectorAll(".mc-mode-card").forEach(function(c){ c.classList.remove("selected"); });
      _mcVisited = {1:true};
    }
    window._mcSkipReset = false;
    _mcUpdateStepper();
    _ensureMetricUxPanels(form);
    // Wire builder column lists now that dialog is visible
    if(_allColumns.length) _wireMetricBuilderColumnLists(form);
  }
  // Build field list if columns are already loaded
  if(_allColumns.length) _buildMcFieldsList(_allColumns);
  // Populate saved metrics panel
  _buildMcMetricsList();
  setTimeout(function(){
    var inp = document.querySelector("#mc-form [name='name']");
    if(inp) inp.focus();
  }, 60);
};

window.closeMetricDialog = function(){
  var ov = document.getElementById("mc-overlay");
  if(ov) ov.classList.remove("open");
  document.body.style.overflow = "";
  _hideSuggestions();
  _hideMcMetricSuggest();
};

// Close on Escape
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    var ov = document.getElementById("mc-overlay");
    if(ov && ov.classList.contains("open")){ closeMetricDialog(); }
  }
});

// QLIK-STYLE FIELD BROWSER (dialog right panel)
// ══════════════════════════════════════════════════════════════════════
function _mcTypeCls(type){
  var t = (type||"").toLowerCase();
  if(/int|num|float|decimal|money|real|double|bigint|tinyint|smallint|numeric/.test(t)) return "num";
  if(/date|time|timestamp|datetime/.test(t)) return "dt";
  if(/char|text|varchar|nvarchar|string|clob/.test(t)) return "str";
  return "oth";
}
function _mcTypeIcon(cls){
  return cls==="num" ? "#" : cls==="dt" ? "◷" : cls==="str" ? "Aa" : "?";
}

window._buildMcFieldsList = function(columns){
  var list   = document.getElementById("mc-fields-list");
  var status = document.getElementById("mc-col-status");
  if(!list) return;
  if(!columns || !columns.length){
    list.innerHTML = '<div style="padding:10px;font-size:12px;color:var(--text-muted)">Schema not yet discovered — run Discovery first.</div>';
    if(status) status.textContent = "";
    return;
  }
  if(status) status.textContent = "("+columns.length+" cols)";
  var grps = {}, grpOrder = [];
  columns.forEach(function(c){
    if(!grps[c.table]){ grps[c.table]=[]; grpOrder.push(c.table); }
    grps[c.table].push(c);
  });
  list.innerHTML = grpOrder.map(function(tbl, gi){
    var rows = grps[tbl].map(function(c){
      var tc  = _mcTypeCls(c.type);
      var til = _mcTypeIcon(tc);
      return '<div class="mc-field-item" data-col="'+escHtml(c.column)+'" data-tbl="'+escHtml(tbl)+'"'
        // escHtml covers & < > " but not the apostrophe, which then closes this
        // handler's string literal early: a column named O'BRIEN would yield
        // insertColumnFromMcDialog('O'BRIEN') and the click throws "missing )
        // after argument list", so the field silently refuses to insert. Escape
        // for the JS context first, as the saved-metrics list below already does.
        +' onclick="insertColumnFromMcDialog(\''+escHtml(c.column.replace(/'/g,"\\'"))+'\')"'
        +' title="'+escHtml(tbl+'.'+c.column+(c.type?' ('+c.type+')':''))+' — click to insert">'
        +'<span class="mc-type-badge '+tc+'">'+til+'</span>'
        +'<span class="mc-field-name">'+escHtml(c.column)+'</span>'
        +'<span class="mc-field-dtype">'+escHtml(c.type||'')+'</span>'
        +'</div>';
    }).join("");
    return '<div class="mc-field-group'+(gi===0?' open':'')+'">'
      +'<div class="mc-field-group-hd" onclick="toggleMcFieldGroup(this)">'
      +'<span>'+escHtml(tbl)+'</span><span class="mc-chev">▶</span></div>'
      +'<div class="mc-field-group-body">'+rows+'</div>'
      +'</div>';
  }).join("");
};

window.filterMcFields = function(q){
  var lc = (q||"").toLowerCase();
  document.querySelectorAll("#mc-fields-list .mc-field-item").forEach(function(item){
    var ok = !lc || item.dataset.col.toLowerCase().includes(lc) || (item.dataset.tbl||"").toLowerCase().includes(lc);
    item.style.display = ok ? "" : "none";
  });
  document.querySelectorAll("#mc-fields-list .mc-field-group").forEach(function(grp){
    var anyVis = Array.from(grp.querySelectorAll(".mc-field-item")).some(function(i){ return i.style.display!=="none"; });
    grp.style.display = anyVis ? "" : "none";
    if(lc && anyVis) grp.classList.add("open");
  });
  // Also filter the saved metrics section
  document.querySelectorAll("#mc-metrics-body .mc-metric-item").forEach(function(item){
    var ok = !lc || (item.dataset.name||"").toLowerCase().includes(lc);
    item.style.display = ok ? "" : "none";
  });
};

/* ── Saved metrics panel ─────────────────────────────────────────────── */
window._buildMcMetricsList = function(){
  var body    = document.getElementById("mc-metrics-body");
  var counter = document.getElementById("mc-metrics-count");
  if(!body) return;
  var metrics = (window._metricsData || []).filter(function(m){ return m.is_active !== 0; });
  if(!metrics.length){
    body.innerHTML = '<div style="padding:8px 10px;font-size:11px;color:var(--text-muted)">No saved metrics yet.</div>';
    if(counter) counter.textContent = "";
    return;
  }
  if(counter) counter.textContent = "("+metrics.length+")";
  body.innerHTML = metrics.map(function(m){
    var fmt = m.result_format || "number";
    var fmtLabel = {currency:"$",percentage:"%",number:"#",date:"date",text:"Aa"}[fmt] || "#";
    return '<div class="mc-metric-item" data-name="'+escHtml(m.name)+'"'
      +' onclick="insertMetricRef(\''+escHtml(m.name.replace(/'/g,"\\'"))+'\')"'
      +' title="'+escHtml(m.name+(m.description?' — '+m.description:''))+' — click to insert ${'+escHtml(m.name)+'}">'
      +'<span class="mc-metric-fx">fx</span>'
      +'<span class="mc-metric-nm">'+escHtml(m.name)+'</span>'
      +'<span class="mc-metric-fmt">'+escHtml(fmtLabel)+'</span>'
      +'</div>';
  }).join("");
};

window.insertMetricRef = function(metricName){
  var editor = _activeEditor || document.querySelector("#mc-form .formula-editor");
  if(!editor) return;
  var macro = "${"+metricName+"}";
  var pos = editor.selectionStart || 0;
  editor.value = editor.value.slice(0, pos) + macro + editor.value.slice(pos);
  var next = pos + macro.length;
  editor.focus();
  editor.setSelectionRange(next, next);
  updateFormulaHints(editor);
  _hideSuggestions();
};

/* ── ${MetricName} autocomplete in formula editor ───────────────────── */
// Trigger when user types ${ — show metric picker dropdown
var _inMetricRef = false;

function _checkMetricRefTrigger(editor){
  var pos  = editor.selectionStart || 0;
  var text = editor.value.slice(0, pos);
  // Detect if cursor is inside an open ${...  (no closing } yet)
  var m = text.match(/\$\{([^}]*)$/);
  if(!m){ _inMetricRef = false; _hideMcMetricSuggest(); return; }
  _inMetricRef = true;
  var partial = m[1].toLowerCase();
  var metrics = (window._metricsData || []).filter(function(mx){
    return mx.is_active !== 0 && mx.name.toLowerCase().startsWith(partial);
  });
  _showMcMetricSuggest(editor, metrics, partial);
}

var _mcMetricSuggestEl = null;
var _mcMetricSuggestIdx = -1;
var _mcMetricSuggestItems = [];

function _showMcMetricSuggest(editor, metrics, partial){
  if(!_mcMetricSuggestEl){
    _mcMetricSuggestEl = document.createElement("div");
    _mcMetricSuggestEl.id = "mc-metric-suggest";
    _mcMetricSuggestEl.style.cssText = "position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:7px;box-shadow:0 6px 24px rgba(0,0,0,.14);z-index:10999;min-width:220px;padding:3px 0;display:none";
    document.body.appendChild(_mcMetricSuggestEl);
  }
  if(!metrics.length){ _hideMcMetricSuggest(); return; }
  _mcMetricSuggestItems = metrics;
  _mcMetricSuggestIdx   = -1;
  _mcMetricSuggestEl.innerHTML = metrics.map(function(m, i){
    var hl = '<mark style="background:none;color:var(--primary,#2B5CE6);font-weight:800">'+escHtml(m.name.slice(0, partial.length))+'</mark>'+escHtml(m.name.slice(partial.length));
    return '<div class="fcs-item" data-idx="'+i+'" onclick="_pickMetricSuggest('+i+')" style="padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:4px;margin:1px 3px;font-size:12px">'
      +'<span style="font-family:Consolas,monospace;background:var(--primary,#2B5CE6);color:var(--on-primary);border-radius:3px;padding:1px 5px;font-size:9px;font-weight:700;flex-shrink:0">fx</span>'
      +'<span style="font-weight:700;flex:1">'+hl+'</span>'
      +'<span style="font-size:9px;color:var(--text-muted)">'+(m.result_format||"")+'</span>'
      +'</div>';
  }).join("");
  var rect = editor.getBoundingClientRect();
  _mcMetricSuggestEl.style.left  = rect.left + "px";
  _mcMetricSuggestEl.style.top   = (rect.bottom + 4) + "px";
  _mcMetricSuggestEl.style.display = "block";
}

function _hideMcMetricSuggest(){
  if(_mcMetricSuggestEl) _mcMetricSuggestEl.style.display = "none";
  _mcMetricSuggestIdx = -1;
}

window._pickMetricSuggest = function(idx){
  var m = _mcMetricSuggestItems[idx];
  if(!m) return;
  var editor = _activeEditor || document.querySelector("#mc-form .formula-editor");
  if(!editor) return;
  var pos  = editor.selectionStart || 0;
  var text = editor.value;
  // Replace everything from ${ to cursor with the full macro + closing }
  var before = text.slice(0, pos).replace(/\$\{[^}]*$/, "${"+m.name+"}");
  editor.value = before + text.slice(pos);
  var next = before.length;
  editor.focus();
  editor.setSelectionRange(next, next);
  updateFormulaHints(editor);
  _hideMcMetricSuggest();
};

window.toggleMcFieldGroup = function(hd){
  var grp = hd.closest(".mc-field-group");
  if(grp) grp.classList.toggle("open");
};

window.insertColumnFromMcDialog = function(colName){
  var ed = document.querySelector("#mc-form .formula-editor");
  if(ed){ insertAtCursor(ed, colName); ed.focus(); }
};

// Build the popover on load
buildPopover();
document.querySelectorAll(".formula-editor").forEach(updateFormulaHints);
document.querySelectorAll(".formula-editor,.metric-builder-row-expression").forEach(_initSqlHighlight);

})();

// SYNONYM COLLISION CHECKER
// Runs on blur of name/synonyms fields. Calls /metrics/check-collision
// and shows an inline amber warning if any phrase matches a business term.
// ══════════════════════════════════════════════════════════════════════
(function(){
  var _collisionTimer = null;

  window.checkSynonymCollision = function(form) {
    if (!form) return;
    clearTimeout(_collisionTimer);
    _collisionTimer = setTimeout(function(){ _runCheck(form); }, 450);
  };

  function _runCheck(form) {
    var nameEl   = form.querySelector('[name="name"]');
    var synEl    = form.querySelector('[name="synonyms"]');
    var skipEl   = form.querySelector('[name="skip_id"]');
    var warnEl   = form.querySelector('.collision-warn');
    if (!warnEl) return;

    var name    = (nameEl  ? nameEl.value.trim()  : "");
    var syns    = (synEl   ? synEl.value.trim()   : "");
    var skipId  = (skipEl  ? skipEl.value.trim()  : "0");
    var allPhrases = [name].concat(syns.split(",").map(function(s){ return s.trim(); }))
                           .filter(Boolean).join(",");
    if (!allPhrases) { warnEl.className="collision-warn"; warnEl.innerHTML=""; return; }

    var m = location.pathname.match(/\/clients\/([^/]+)\//);
    if (!m) return;
    var url = "/admin/clients/"+m[1]+"/metrics/check-collision?phrases="+encodeURIComponent(allPhrases)
              +(skipId && skipId!=="0" ? "&skip_id="+skipId : "");

    fetch(url).then(function(r){ return r.json(); }).then(function(data){
      if (!data.collisions || !data.collisions.length) {
        warnEl.className = "collision-warn";
        warnEl.innerHTML = "";
        return;
      }
      var msgs = data.collisions.map(function(c){
        return "<strong>\""+escHtml2(c.metric_phrase)+"\"</strong> matches business term <strong>\""+escHtml2(c.term)+"\"</strong>"
             + (c.term_aliases ? " (aliases: "+escHtml2(c.term_aliases)+")" : "")
             + ". The metric formula will take precedence in queries, but consider removing the term alias to avoid confusion.";
      });
      warnEl.className = "collision-warn show";
      warnEl.innerHTML = "Synonym collision detected:<br>" + msgs.join("<br>");
    }).catch(function(){});
  }

  function escHtml2(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
})();
</script>
