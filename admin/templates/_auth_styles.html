{# The sign-in pages' look: login, the first Super admin account, an invitation. #}
{% macro auth_styles() %}
<style>
.auth-card-wrap {
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  padding-top: 4rem;
}
.auth-brand-identity {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .5rem;
  margin-bottom: 1.5rem;
  text-align: center;
}
.auth-brand-name {
  font-size: var(--font-2xl);
  font-weight: var(--weight-bold);
  color: var(--text);
  letter-spacing: -.03em;
}
.auth-brand-tag {
  margin-left: 4px;
  padding: 1px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  vertical-align: middle;
  font-size: var(--font-xs);
  font-weight: var(--weight-semibold);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.auth-card { box-shadow: var(--shadow-md); }
.auth-switch { margin: 1rem 0 0; text-align: center; font-size: var(--font-sm); }
.auth-wide { max-width: 440px; }
.auth-lead { margin: 0 0 1rem; font-size: var(--font-sm); line-height: 1.5; color: var(--text-soft); }
.auth-note { margin: 1rem 0 0; font-size: var(--font-sm); color: var(--text-muted); line-height: 1.45; }
.auth-card .card-header h1 {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: var(--font-base);
  font-weight: var(--weight-bold);
  color: var(--text-soft);
}

</style>
{% endmacro %}
